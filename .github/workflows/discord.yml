name: Discord Notification

# Manual re-send (or test post) of a release's changelog, using the same panels as release.yml's
# send_discord_notification job but without the release role ping

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to post, e.g. 6.3.0 (leave empty for the latest release)'
        required: false
        default: ''
      webhook_secret:
        # The name of a repo secret, never a raw webhook URL - workflow inputs are visible to anyone
        # who can see this public repo's runs, and the URL alone is enough to post as the webhook
        description: 'Repo secret holding the webhook URL (e.g. DISCORD_TEST_WEBHOOK for a test channel)'
        required: false
        default: 'DISCORD_WEBHOOK'
      dry_run:
        description: 'Print the panel payloads without posting anything'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Send to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets[inputs.webhook_secret || 'DISCORD_WEBHOOK'] }}
          WEBHOOK_SECRET: ${{ inputs.webhook_secret || 'DISCORD_WEBHOOK' }}
          VERSION: ${{ inputs.version || 'latest' }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Only used to look up the latest release without hitting the anonymous API rate limit
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/discord-changelog.mjs --version "$VERSION" --dry-run
            exit
          fi
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::error::The repo secret $WEBHOOK_SECRET is missing or empty"
            exit 1
          fi
          node scripts/discord-changelog.mjs --version "$VERSION"
