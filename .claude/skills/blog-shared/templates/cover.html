<!doctype html>
<!--
  Blog cover template - 1200x630, doubles as the OG/social image. Render with
  ../scripts/render_html.py. To make a cover: copy this file to the scratchpad, then edit ONLY the
  four marked spots (LOGO path, CATEGORY, TITLE, VISUAL). Keep the rest so every cover matches.

  Rules (see create-blog-post/references/post-format.md "Producing media"):
  - Title: the post's short headline, 3-8 words, max 3 lines at this size. Wrap 1-3 key words in
    <span class="hl"> for the accent gradient.
  - VISUAL: an original, abstract illustration of the topic built from HTML/CSS (cards, bars,
    trophies, icons). Never real game art, never a fake screenshot of Steam or SGI UI, never
    Steam/Valve logos.
  - Always look at the rendered PNG before using it.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #050506;
        --text: #f5f5f5;
        --muted: #a3a3a3;
        --accent: #00a3ff;
        --lime: #a5f84c;
        --purple: #b06cff;
        --border: rgba(255, 255, 255, 0.1);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        position: relative;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Geist', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* layered glow + grid, matching the site's dark/accent look */
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 55% 70% at 88% 18%, rgba(0, 163, 255, 0.3), transparent 62%),
          radial-gradient(ellipse 45% 55% at 4% 108%, rgba(165, 248, 76, 0.13), transparent 60%),
          radial-gradient(ellipse 60% 60% at 70% 110%, rgba(176, 108, 255, 0.14), transparent 60%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 80% 90% at 75% 40%, black, transparent 75%);
      }
      .content {
        position: absolute;
        left: 64px;
        top: 56px;
        bottom: 56px;
        width: 560px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 600;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      .brand img {
        width: 30px;
        height: 30px;
      }
      .brand .sep {
        color: rgba(255, 255, 255, 0.25);
      }
      .brand .blog {
        color: var(--muted);
        font-weight: 500;
      }
      .chip {
        align-self: flex-start;
        margin-top: auto;
        margin-bottom: 22px;
        padding: 7px 14px;
        border-radius: 8px;
        background: rgba(0, 163, 255, 0.12);
        border: 1px solid rgba(0, 163, 255, 0.35);
        color: #4cc0ff;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      h1 {
        font-size: 64px;
        line-height: 1.04;
        font-weight: 800;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }
      .hl {
        background: linear-gradient(120deg, #6fd0ff 0%, var(--accent) 45%, #8f7dff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .url {
        margin-top: 26px;
        font-family: 'Geist Mono', monospace;
        font-size: 16px;
        color: rgba(255, 255, 255, 0.45);
      }
      .visual {
        position: absolute;
        right: 56px;
        top: 0;
        bottom: 0;
        width: 480px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* reusable visual pieces */
      .glass {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.03));
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(6px);
      }
    </style>
    <!-- VISUAL STYLES: per-cover CSS goes here -->
    <style>
      .sets {
        width: 440px;
        padding: 26px 26px 22px;
        transform: rotate(-2deg);
      }
      .sets .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 18px;
      }
      .sets .head b {
        font-size: 21px;
        font-weight: 700;
      }
      .sets .head span {
        font-size: 15px;
        color: var(--muted);
      }
      .row {
        padding: 14px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
      }
      .row .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-size: 17px;
        font-weight: 600;
      }
      .row .tag {
        font-size: 13px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 6px;
        letter-spacing: 0.02em;
      }
      .bar {
        height: 9px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 99px;
      }
      .blue .tag {
        background: rgba(0, 163, 255, 0.16);
        color: #5cc6ff;
      }
      .blue i {
        width: 100%;
        background: linear-gradient(90deg, #0a84ff, #33b5ff);
        box-shadow: 0 0 18px rgba(0, 163, 255, 0.7);
      }
      .purple .tag {
        background: rgba(176, 108, 255, 0.16);
        color: #c79bff;
      }
      .purple i {
        width: 62%;
        background: linear-gradient(90deg, #8a4dff, #c084fc);
        box-shadow: 0 0 18px rgba(176, 108, 255, 0.6);
      }
      .archived {
        opacity: 0.55;
      }
      .archived .tag {
        background: rgba(255, 255, 255, 0.08);
        color: #bdbdbd;
      }
      .archived .bar {
        background: repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.18) 0 10px,
          transparent 10px 18px
        );
      }
      .trophy {
        position: absolute;
        right: -6px;
        top: 70px;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 35% 30%, #5cc6ff, #0a6fd6 70%);
        box-shadow:
          0 0 0 6px rgba(0, 163, 255, 0.18),
          0 18px 40px rgba(0, 120, 255, 0.55);
        transform: rotate(8deg);
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="grid"></div>

    <div class="content">
      <div class="brand">
        <!-- LOGO: absolute file:// path to docs/public/logo.png -->
        <img src="file:///C:/Users/proba/Projects/steam-game-idler/docs/public/logo.png" alt="" />
        <span>Steam Game Idler</span><span class="sep">/</span><span class="blog">Blog</span>
      </div>
      <!-- CATEGORY -->
      <div class="chip">Steam News</div>
      <!-- TITLE -->
      <h1>Steam <span class="hl">Achievement Sets</span>, explained</h1>
      <div class="url">steamgameidler.com/blog</div>
    </div>

    <!-- VISUAL -->
    <div class="visual">
      <div class="glass sets">
        <div class="head"><b>Achievement sets</b></div>
        <div class="row blue">
          <div class="top"><span>Base game</span><span class="tag">COMPLETE</span></div>
          <div class="bar"><i></i></div>
        </div>
        <div class="row purple">
          <div class="top"><span>DLC expansion</span><span class="tag">DLC · 62%</span></div>
          <div class="bar"><i></i></div>
        </div>
        <div class="row archived">
          <div class="top"><span>Season one</span><span class="tag">ARCHIVED</span></div>
          <div class="bar"></div>
        </div>
      </div>
      <div class="trophy">
        <svg
          width="46"
          height="46"
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
          <path d="M4 22h16" />
          <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
          <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
          <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
        </svg>
      </div>
    </div>
  </body>
</html>
