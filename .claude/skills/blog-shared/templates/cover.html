<!doctype html>
<!--
  Blog cover template - 1200x630, doubles as the OG/social image and the blog card. Render with
  ../scripts/render_html.py. To make a cover: copy this file to the scratchpad, then edit ONLY the
  three marked spots (CATEGORY, TITLE, VISUAL + its styles). Keep the rest so every cover matches.

  Design: the site's own look (steamgameidler.com home hero and the site OG images) - black
  starfield, soft rainbow glows, the nav PRO pill's rainbow rim around the brand, a mono eyebrow,
  a headline with rainbow-tinted key words, and the visual in a glass card with the 3D window's rainbow rim glow.

  Rules (see create-blog-post/references/post-format.md "Producing media"):
  - Title: the post's short headline, 3-8 words. Wrap 1-3 key words in <span class="hl"> for the
    rainbow-tinted gradient; a highlighted phrase never breaks across lines. The title sizes itself
    (fitTitle below): the largest size that fits 2 balanced lines, else 3, with no word
    overflowing - so don't hand-tune font sizes or add <br>s.
  - VISUAL: an original, abstract illustration of the topic built from HTML/CSS (cards, bars,
    trophies, icons as inline SVG) inside the .visual slot, ideally one .glass card plus at most
    one floating accent. Never real game art, never a fake screenshot of Steam or SGI UI, never
    Steam/Valve logos. The cover's alt text describes this visual, so keep the two in step.
  - Always look at the rendered PNG before using it.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --text: #f5f5f5;
        --muted: #a3a3a3;
        --border: rgba(255, 255, 255, 0.09);
        /* the site's muted rainbow (the nav PRO pill / CTA rim) and the brighter glow variant
           the OG images use behind their visuals */
        --rainbow: conic-gradient(
          from 90deg,
          hsl(0, 36%, 50%),
          hsl(60, 36%, 50%),
          hsl(120, 36%, 50%),
          hsl(180, 36%, 50%),
          hsl(240, 36%, 50%),
          hsl(300, 36%, 50%),
          hsl(360, 36%, 50%)
        );
        --rainbow-glow: conic-gradient(
          from 90deg,
          hsl(0, 55%, 58%),
          hsl(60, 55%, 58%),
          hsl(120, 55%, 58%),
          hsl(180, 55%, 58%),
          hsl(240, 55%, 58%),
          hsl(300, 55%, 58%),
          hsl(360, 55%, 58%)
        );
        /* muted accent hues for visuals - same family as the rainbow, never neon */
        --blue: hsl(210, 70%, 62%);
        --purple: hsl(265, 60%, 68%);
        --green: hsl(145, 50%, 58%);
        --amber: hsl(40, 75%, 62%);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #000;
        color: var(--text);
        font-family: 'Geist', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .stage {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(45% 60% at 85% 50%, rgba(120, 70, 200, 0.2), transparent 70%),
          radial-gradient(40% 45% at 0% 100%, rgba(60, 170, 200, 0.12), transparent 70%),
          radial-gradient(35% 40% at 100% 0%, rgba(220, 120, 60, 0.1), transparent 70%), #000;
      }
      #stars {
        position: absolute;
        inset: 0;
      }

      /* left column: brand pill, eyebrow + title (vertically centred), url */
      .content {
        position: absolute;
        left: 64px;
        top: 56px;
        bottom: 56px;
        width: 640px;
        display: flex;
        flex-direction: column;
        z-index: 2;
      }
      /* the docs nav's PRO pill (.rainbow-chip + .rainbow-chip--glow) */
      .chip {
        position: relative;
        align-self: flex-start;
        display: inline-flex;
        padding: 1.5px;
        border-radius: 999px;
        overflow: hidden;
        isolation: isolate;
        box-shadow:
          0 0 22px -4px hsla(265, 60%, 60%, 0.5),
          0 0 22px -6px hsla(160, 60%, 55%, 0.4);
      }
      .chip::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--rainbow);
      }
      .chip__inner {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 20px 8px 16px;
        border-radius: 999px;
        background: #050505;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .chip__inner svg {
        width: 20px;
        height: 20px;
        fill: #fff;
      }
      .chip__sep {
        color: rgba(255, 255, 255, 0.25);
        font-weight: 500;
      }
      .chip__blog {
        color: var(--muted);
        font-weight: 500;
      }
      .headline {
        margin: auto 0;
      }
      .eyebrow {
        font-family: 'Geist Mono', monospace;
        font-size: 15px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 18px;
      }
      h1 {
        font-size: 78px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.045em;
        text-wrap: balance;
        hyphens: none;
        overflow-wrap: normal;
      }
      /* key words in a soft tint of the rainbow rim (the site's silver .gradient-text vanished on a
         short phrase); nowrap keeps a highlighted phrase on one line */
      .hl {
        white-space: nowrap;
        background: linear-gradient(
          90deg,
          hsl(190, 65%, 74%),
          hsl(250, 70%, 80%) 55%,
          hsl(320, 60%, 78%)
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        padding-bottom: 0.12em;
      }
      .url {
        font-family: 'Geist Mono', monospace;
        font-size: 15px;
        color: rgba(255, 255, 255, 0.4);
      }

      /* right side: the visual, tilted slightly toward the title, over the rainbow rim glow */
      .visual {
        position: absolute;
        right: 44px;
        top: 0;
        bottom: 0;
        width: 440px;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1400px;
        z-index: 1;
      }
      .visual__inner {
        position: relative;
        transform: rotateY(-12deg) rotateX(4deg);
        transform-style: preserve-3d;
      }
      .visual__inner::before {
        content: '';
        position: absolute;
        inset: -6%;
        z-index: -1;
        border-radius: 12%;
        background: var(--rainbow-glow);
        filter: blur(48px);
        opacity: 0.45;
      }
      /* reusable visual pieces */
      .glass {
        position: relative;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02)), #0b0b0e;
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.07);
      }
      .tag {
        font-size: 12px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 6px;
        letter-spacing: 0.04em;
        background: rgba(255, 255, 255, 0.08);
        color: #cfcfcf;
      }
      /* a round floating accent (icon orb) with a rainbow rim */
      .orb {
        position: absolute;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        padding: 2px;
        background: var(--rainbow);
        box-shadow:
          0 18px 40px rgba(0, 0, 0, 0.6),
          0 0 30px -6px hsla(265, 60%, 60%, 0.6);
      }
      .orb > div {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 35% 30%, #26262c, #0b0b0e 70%);
      }
    </style>
    <!-- VISUAL STYLES: per-cover CSS goes here -->
    <style>
      .sets {
        width: 400px;
        padding: 26px 26px 20px;
      }
      .sets .head {
        font-size: 21px;
        font-weight: 700;
        margin-bottom: 16px;
      }
      .row {
        padding: 14px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
      }
      .row .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-size: 17px;
        font-weight: 600;
      }
      .bar {
        height: 9px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 99px;
      }
      .done .tag {
        background: hsla(210, 70%, 62%, 0.16);
        color: var(--blue);
      }
      .done i {
        width: 100%;
        background: linear-gradient(90deg, hsl(210, 60%, 50%), var(--blue));
      }
      .dlc .tag {
        background: hsla(265, 60%, 68%, 0.16);
        color: var(--purple);
      }
      .dlc i {
        width: 62%;
        background: linear-gradient(90deg, hsl(265, 50%, 55%), var(--purple));
      }
      .archived {
        opacity: 0.55;
      }
      .archived .bar {
        background: repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.18) 0 10px,
          transparent 10px 18px
        );
      }
      .sets-orb {
        right: -30px;
        top: -42px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="stars" width="1200" height="630"></canvas>

      <div class="content">
        <span class="chip"
          ><span class="chip__inner"
            ><svg viewBox="0 0 256 256">
              <path
                d="M206.3 57.21Q228.46 70.21 228.46 96V160Q228.46 186 205.94 199L150.52 231Q128 244 105.48 231L83.69 218.42L165.26 171.33Q175.65 165.33 175.65 153.33V138.07Q175.65 132.07 173.05 130.57Q170.45 129.07 165.26 132.07L145 143.77V92.6L206.3 57.21ZM150.52 25 172.31 37.58 90.74 84.67Q80.35 90.67 80.35 102.67V117.93Q80.35 123.93 82.95 125.43Q85.55 126.93 90.74 123.93L111 112.23V163.4L49.7 198.79Q27.54 185.79 27.54 160V96Q27.54 70 50.06 57L105.48 25Q128 12 150.52 25Z"
              /></svg
            >Steam Game Idler<span class="chip__sep">/</span
            ><span class="chip__blog">Blog</span></span
          ></span
        >
        <div class="headline">
          <!-- CATEGORY: the post's frontmatter category -->
          <div class="eyebrow">Steam News</div>
          <!-- TITLE -->
          <h1>Steam <span class="hl">Achievement Sets</span>, explained</h1>
        </div>
        <div class="url">steamgameidler.com/blog</div>
      </div>

      <!-- VISUAL: everything inside .visual__inner -->
      <div class="visual">
        <div class="visual__inner">
          <div class="glass sets">
            <div class="head">Achievement sets</div>
            <div class="row done">
              <div class="top"><span>Base game</span><span class="tag">COMPLETE</span></div>
              <div class="bar"><i></i></div>
            </div>
            <div class="row dlc">
              <div class="top"><span>DLC expansion</span><span class="tag">DLC · 62%</span></div>
              <div class="bar"><i></i></div>
            </div>
            <div class="row archived">
              <div class="top"><span>Season one</span><span class="tag">ARCHIVED</span></div>
              <div class="bar"></div>
            </div>
          </div>
          <div class="orb sets-orb">
            <div>
              <svg
                width="38"
                height="38"
                viewBox="0 0 24 24"
                fill="none"
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
                <path d="M4 22h16" />
                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // deterministic starfield, like the site's background dust
      const sc = document.getElementById('stars').getContext('2d')
      let seed = 7
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647
      for (let i = 0; i < 150; i++) {
        sc.fillStyle = `rgba(255,255,255,${0.12 + rnd() * 0.45})`
        sc.beginPath()
        sc.arc(rnd() * 1200, rnd() * 630, rnd() * 1.1 + 0.3, 0, 7)
        sc.fill()
      }

      // Title auto-fit: the largest size (78px down to 60px) that sets the title in 2 lines with
      // no word (or nowrap highlight) overflowing the column; a title that can't do that gets the
      // largest size that fits 3 lines instead (down to 44px). Two big lines read better at
      // thumbnail size than three, and stop a short last word sitting alone on line 3.
      // text-wrap: balance then evens the lines out.
      function fitTitle() {
        const h1 = document.querySelector('h1')
        const fits = (size, maxLines) => {
          h1.style.fontSize = size + 'px'
          const lines = Math.round(h1.getBoundingClientRect().height / size)
          return lines <= maxLines && h1.scrollWidth <= h1.clientWidth
        }
        for (let size = 78; size >= 60; size -= 2) if (fits(size, 2)) return
        for (let size = 78; size >= 44; size -= 2) if (fits(size, 3)) return
      }
      document.fonts.ready.then(fitTitle)
    </script>
  </body>
</html>
