<!-- Idea: your Steam level is fed by badges - a level ring with XP-giving badges in orbit. -->
<cover category="Guides" hue="40" tilt="false" archetype="orbit">
  <title>How to <span class="hl">level up</span> on Steam</title>
  <style>
    .sys {
      position: relative;
      width: 420px;
      height: 420px;
    }
    .orbit {
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.14);
    }
    .core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 196px;
      height: 196px;
      margin: -98px 0 0 -98px;
      border-radius: 50%;
      padding: 9px;
      background: conic-gradient(
        from 200deg,
        hsl(40, 75%, 62%),
        hsl(15, 70%, 60%),
        hsl(330, 55%, 66%),
        hsl(265, 55%, 68%) 78%,
        rgba(255, 255, 255, 0.08) 78%
      );
      box-shadow:
        0 0 60px -10px hsla(40, 75%, 55%, 0.55),
        0 30px 80px rgba(0, 0, 0, 0.6);
    }
    .core > div {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: grid;
      place-items: center;
      text-align: center;
      background: radial-gradient(circle at 35% 28%, #24211c, #0a0908 72%);
    }
    .core .lvl {
      font-size: 84px;
      font-weight: 600;
      letter-spacing: -0.05em;
      line-height: 0.9;
    }
    .core .cap {
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.3em;
      color: var(--muted);
      margin-top: 6px;
    }
    .badge {
      position: absolute;
      width: 78px;
      height: 88px;
      display: grid;
      place-items: center;
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    }
    .badge::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--b);
    }
    .badge::after {
      content: '';
      position: absolute;
      inset: 3px;
      background: radial-gradient(circle at 40% 30%, #2a2a30, #0c0c0f 75%);
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    }
    .badge svg {
      position: relative;
      z-index: 1;
      width: 32px;
      height: 32px;
    }
    .b1 {
      left: 171px;
      top: -18px;
      --b: linear-gradient(hsl(40, 75%, 62%), hsl(20, 70%, 52%));
    }
    .b2 {
      right: -12px;
      top: 166px;
      --b: linear-gradient(hsl(330, 55%, 66%), hsl(300, 45%, 52%));
    }
    .b3 {
      left: 171px;
      bottom: -18px;
      --b: linear-gradient(hsl(265, 55%, 70%), hsl(235, 50%, 56%));
    }
    .b4 {
      left: -12px;
      top: 166px;
      --b: linear-gradient(hsl(190, 55%, 62%), hsl(160, 45%, 48%));
    }
    .xp {
      position: absolute;
      right: 34px;
      top: 54px;
      padding: 7px 13px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 16px;
      background: hsla(40, 75%, 62%, 0.14);
      color: var(--amber);
      border: 1px solid hsla(40, 75%, 62%, 0.35);
    }
  </style>
  <visual>
    <div class="sys">
      <div class="orbit"></div>
      <div class="core">
        <div>
          <div>
            <div class="lvl">30</div>
            <div class="cap">LEVEL</div>
          </div>
        </div>
      </div>
      <div class="badge b1">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="5" y="3" width="14" height="18" rx="2" />
          <circle cx="12" cy="11" r="3" />
        </svg>
      </div>
      <div class="badge b2">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" />
        </svg>
      </div>
      <div class="badge b3">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="5" width="18" height="16" rx="2" />
          <path d="M3 10h18M8 3v4M16 3v4" />
        </svg>
      </div>
      <div class="badge b4">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M18 2H6v7a6 6 0 0 0 12 0V2Z"
          />
        </svg>
      </div>
      <div class="xp">+100 XP</div>
    </div>
  </visual>
</cover>
