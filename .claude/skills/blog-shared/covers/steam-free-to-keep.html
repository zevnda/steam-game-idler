<!-- Idea: a paid game handed over as a $0.00 ticket you keep, with the catch stamped on it,
     and a Free Weekend's temporary ticket fading behind. -->
<cover category="Explainers" hue="145" tilt="true" archetype="ticket">
  <title>What <span class="hl">Free to Keep</span> means on Steam</title>
  <style>
    .tickets {
      position: relative;
      width: 420px;
      height: 300px;
    }
    .ticket {
      position: absolute;
      width: 400px;
      height: 220px;
      display: flex;
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02)), #0b0d0c;
      border: 1px solid var(--border);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      -webkit-mask:
        radial-gradient(circle 16px at 128px 0, transparent 98%, #000) top / 100% 51% no-repeat,
        radial-gradient(circle 16px at 128px 100%, transparent 98%, #000) bottom / 100% 51%
          no-repeat;
      mask:
        radial-gradient(circle 16px at 128px 0, transparent 98%, #000) top / 100% 51% no-repeat,
        radial-gradient(circle 16px at 128px 100%, transparent 98%, #000) bottom / 100% 51%
          no-repeat;
    }
    .stub {
      width: 128px;
      display: grid;
      place-items: center;
      border-right: 2px dashed rgba(255, 255, 255, 0.14);
    }
    .stub svg {
      width: 50px;
      height: 50px;
    }
    .main {
      flex: 1;
      padding: 28px 28px 0;
    }
    .was {
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.24em;
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-color: hsla(0, 60%, 65%, 0.8);
    }
    .price {
      font-size: 64px;
      font-weight: 600;
      letter-spacing: -0.05em;
      line-height: 1;
      margin: 10px 0 14px;
    }
    .keep {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .front {
      left: 0;
      top: 64px;
      z-index: 2;
    }
    .front .stub {
      background: linear-gradient(160deg, hsla(145, 50%, 50%, 0.35), hsla(145, 50%, 40%, 0.08));
    }
    .ghost {
      left: 34px;
      top: -6px;
      opacity: 0.4;
      transform: rotate(-7deg);
    }
    .ghost .main {
      padding-top: 22px;
    }
    .ghost .was {
      white-space: nowrap;
      letter-spacing: 0.16em;
    }
    .stamp {
      position: absolute;
      right: 2px;
      top: 76px;
      z-index: 3;
      transform: rotate(-10deg);
      padding: 7px 12px;
      border-radius: 8px;
      border: 2px solid hsla(350, 65%, 68%, 0.85);
      color: hsl(350, 70%, 74%);
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.14em;
      background: rgba(10, 6, 8, 0.85);
    }
  </style>
  <visual>
    <div class="tickets">
      <div class="ticket ghost">
        <div class="stub"></div>
        <div class="main">
          <div class="was" style="text-decoration: none">FREE WEEKEND · ENDS MONDAY</div>
        </div>
      </div>
      <div class="ticket front">
        <div class="stub">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="8" width="18" height="4" rx="1" />
            <path d="M12 8v13" />
            <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" />
            <path
              d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"
            />
          </svg>
        </div>
        <div class="main">
          <div class="was">PAID GAME</div>
          <div class="price">$0.00</div>
          <span class="keep">YOURS TO KEEP</span>
        </div>
      </div>
      <div class="stamp">NO CARD DROPS</div>
    </div>
  </visual>
</cover>
