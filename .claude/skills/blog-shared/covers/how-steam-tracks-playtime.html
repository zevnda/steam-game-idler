<!-- Idea: Steam counts running time, not activity - a stopwatch that keeps going through AFK,
     minimized and Invisible. -->
<cover category="Explainers" hue="185" tilt="false" archetype="dial">
  <title>How Steam <span class="hl">tracks playtime</span></title>
  <style>
    .dial {
      position: relative;
      width: 380px;
      height: 380px;
    }
    .dial svg {
      position: absolute;
      inset: 0;
    }
    .dial .face {
      position: absolute;
      inset: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #1c1f24, #08090b 72%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 30px 80px rgba(0, 0, 0, 0.6);
      display: grid;
      place-items: center;
      text-align: center;
    }
    .dial .label {
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.28em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .dial .time {
      font-size: 62px;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1;
      margin: 10px 0 8px;
    }
    .dial .sub {
      font-size: 15px;
      color: var(--muted);
    }
    .crown {
      position: absolute;
      left: 50%;
      top: -6px;
      width: 34px;
      height: 22px;
      margin-left: -17px;
      border-radius: 7px 7px 4px 4px;
      background: linear-gradient(#2a2d33, #121317);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .states {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 26px;
    }
    .state {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      font-size: 15px;
      font-weight: 500;
    }
    .state i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
  </style>
  <visual>
    <div class="dial">
      <div class="crown"></div>
      <svg viewBox="0 0 380 380">
        <defs>
          <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="hsl(185,60%,48%)" />
            <stop offset="1" stop-color="hsl(220,65%,70%)" />
          </linearGradient>
        </defs>
        <circle
          cx="190"
          cy="190"
          r="168"
          fill="none"
          stroke="rgba(255,255,255,.07)"
          stroke-width="12"
        />
        <circle
          cx="190"
          cy="190"
          r="168"
          fill="none"
          stroke="url(#arc)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-dasharray="845 1056"
          transform="rotate(-90 190 190)"
        />
        <g stroke="rgba(255,255,255,.22)" stroke-width="2">
          <line x1="190" y1="36" x2="190" y2="48" />
          <line x1="344" y1="190" x2="332" y2="190" />
          <line x1="190" y1="344" x2="190" y2="332" />
          <line x1="36" y1="190" x2="48" y2="190" />
        </g>
      </svg>
      <div class="face">
        <div>
          <div class="label">Counting</div>
          <div class="time">4h 12m</div>
          <div class="sub">game running</div>
        </div>
      </div>
    </div>
    <div class="states">
      <span class="state"><i></i>AFK</span>
      <span class="state"><i></i>Minimized</span>
      <span class="state"><i></i>Invisible</span>
    </div>
  </visual>
</cover>
