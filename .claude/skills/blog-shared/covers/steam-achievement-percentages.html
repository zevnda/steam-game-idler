<!-- Idea: a game's achievements sorted by global unlock % - the long tail is where "rare"
     lives. -->
<cover category="Explainers" hue="280" tilt="false" archetype="chart">
  <title>Steam achievement <span class="hl">percentages</span>, explained</title>
  <style>
    .chart {
      position: relative;
      width: 420px;
      padding-top: 120px;
    }
    .bars {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 270px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
    }
    .bars i {
      flex: 1;
      border-radius: 6px 6px 0 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.08));
    }
    .bars i.rare {
      background: linear-gradient(180deg, hsl(40, 80%, 66%), hsl(20, 70%, 52%));
      box-shadow: 0 0 22px hsla(40, 80%, 60%, 0.7);
    }
    .axis {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.14em;
      color: var(--muted);
    }
    .callout {
      position: absolute;
      right: -6px;
      top: 10px;
      text-align: right;
    }
    .callout .pct {
      font-size: 70px;
      font-weight: 600;
      letter-spacing: -0.05em;
      line-height: 1;
      background: linear-gradient(90deg, hsl(40, 80%, 70%), hsl(20, 75%, 64%));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .callout .tag {
      display: inline-block;
      margin-top: 8px;
      background: hsla(40, 80%, 62%, 0.15);
      color: var(--amber);
    }
    .lead {
      position: absolute;
      right: 9px;
      top: 112px;
      width: 1px;
      height: 128px;
      background: linear-gradient(rgba(255, 255, 255, 0.35), transparent);
    }
  </style>
  <visual>
    <div class="chart">
      <div class="callout">
        <div class="pct">2.4%</div>
        <span class="tag">RARE</span>
      </div>
      <div class="lead"></div>
      <div class="bars">
        <i style="height: 96%"></i><i style="height: 84%"></i><i style="height: 74%"></i
        ><i style="height: 65%"></i> <i style="height: 57%"></i><i style="height: 49%"></i
        ><i style="height: 42%"></i><i style="height: 35%"></i> <i style="height: 29%"></i
        ><i style="height: 23%"></i><i style="height: 17%"></i><i style="height: 12%"></i>
        <i style="height: 8%"></i><i class="rare" style="height: 4%"></i>
      </div>
      <div class="axis"><span>MOST PLAYERS</span><span>FEWEST</span></div>
    </div>
  </visual>
</cover>
