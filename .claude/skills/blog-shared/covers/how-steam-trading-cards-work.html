<!-- Idea: a game's trading cards, collected into a set and crafted into a badge worth XP.
     Rebuilt 2026-11-06 from the original (pre-registry) cover, same fanned-cards idea. -->
<cover category="Explainers" hue="320" tilt="true" archetype="fan">
  <title>How Steam <span class="hl">trading cards</span> work</title>
  <style>
    .fan {
      position: relative;
      width: 420px;
      height: 360px;
    }
    .card {
      position: absolute;
      top: 30px;
      left: 125px;
      width: 170px;
      height: 240px;
      border-radius: 16px;
      padding: 10px;
      background: linear-gradient(180deg, #1b1b20, #0c0c0f);
      border: 1px solid var(--border);
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transform-origin: 50% 120%;
    }
    .card .art {
      height: 150px;
      border-radius: 10px;
      background: var(--c);
      display: grid;
      place-items: center;
    }
    .card .art::after {
      content: '';
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
    }
    .card .line {
      height: 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
      margin-top: 14px;
    }
    .card .line.short {
      width: 60%;
      margin-top: 9px;
    }
    .c1 {
      --c: linear-gradient(160deg, hsl(350, 55%, 62%), hsl(15, 60%, 50%));
      transform: rotate(-17deg) translateX(-46px);
    }
    .c2 {
      --c: linear-gradient(160deg, hsl(150, 45%, 58%), hsl(175, 50%, 42%));
      transform: rotate(17deg) translateX(46px);
    }
    .c3 {
      --c: linear-gradient(160deg, hsl(215, 70%, 66%), hsl(265, 55%, 62%));
      top: 14px;
      z-index: 2;
    }
    .xp {
      position: absolute;
      right: 0;
      bottom: 18px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px 12px 12px;
      border-radius: 16px;
      background: rgba(12, 12, 15, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .xp .ic {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(150deg, hsl(230, 65%, 64%), hsl(265, 55%, 62%));
    }
    .xp b {
      display: block;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .xp span {
      font-size: 13px;
      color: var(--muted);
    }
  </style>
  <visual>
    <div class="fan">
      <div class="card c1">
        <div class="art"></div>
        <div class="line"></div>
        <div class="line short"></div>
      </div>
      <div class="card c2">
        <div class="art"></div>
        <div class="line"></div>
        <div class="line short"></div>
      </div>
      <div class="card c3">
        <div class="art"></div>
        <div class="line"></div>
        <div class="line short"></div>
      </div>
      <div class="xp">
        <div class="ic">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" />
          </svg>
        </div>
        <div><b>+100 XP</b><span>Badge crafted</span></div>
      </div>
    </div>
  </visual>
</cover>
