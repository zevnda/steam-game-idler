<!-- Idea: one achievement moving through what you can actually do to it - unlocked, reset
     (relocked), hidden. -->
<cover category="Explainers" hue="350" tilt="true" archetype="sequence">
  <title><span class="hl">Remove, hide</span> or reset Steam achievements</title>
  <style>
    .seq {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 30px;
    }
    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .step:nth-of-type(1) {
      transform: translateY(-34px);
    }
    .step:nth-of-type(3) {
      transform: translateY(34px);
    }
    .tile {
      width: 100px;
      height: 100px;
      border-radius: 26px;
      display: grid;
      place-items: center;
      position: relative;
      background: radial-gradient(circle at 35% 28%, #26262c, #0b0b0e 75%);
      border: 1px solid var(--border);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }
    .tile svg {
      width: 48px;
      height: 48px;
    }
    .lit {
      background: linear-gradient(150deg, hsl(350, 60%, 62%), hsl(20, 70%, 58%));
      border-color: transparent;
      box-shadow:
        0 0 50px -8px hsla(350, 60%, 58%, 0.7),
        0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .dim {
      opacity: 0.55;
      border-style: dashed;
      border-color: rgba(255, 255, 255, 0.22);
    }
    .cap {
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.22em;
      color: var(--muted);
    }
    .lit-cap {
      color: hsl(350, 70%, 75%);
    }
    .arrow {
      width: 28px;
      height: 2px;
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.35) 0 6px,
        transparent 6px 11px
      );
      margin-bottom: 28px;
    }
  </style>
  <visual>
    <div class="seq">
      <div class="step">
        <div class="tile lit">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"
            />
          </svg>
        </div>
        <div class="cap lit-cap">UNLOCKED</div>
      </div>
      <div class="arrow"></div>
      <div class="step">
        <div class="tile">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </div>
        <div class="cap">RESET</div>
      </div>
      <div class="arrow"></div>
      <div class="step">
        <div class="tile dim">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M9.9 4.2A9 9 0 0 1 12 4c7 0 10 8 10 8a13 13 0 0 1-1.7 2.7M6.6 6.6A13.5 13.5 0 0 0 2 12s3 8 10 8a9.7 9.7 0 0 0 5.4-1.6M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20"
            />
          </svg>
        </div>
        <div class="cap">HIDDEN</div>
      </div>
    </div>
  </visual>
</cover>
